[project]
name = "voice-project"
version = "0.1.0"
description = "Reconocimiento de palabras aisladas en español"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # MSWC en Hugging Face usa un script de carga, que datasets 4 ya no soporta.
    "datasets>=3,<4",
    "numpy",
    "scipy",
    "soundfile",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr"]
